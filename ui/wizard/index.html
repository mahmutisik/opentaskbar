<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTaskBar</title>
<style>/*@CSS*/</style>
</head>
<body>
<div class="shell" id="app">
  <header class="titlebar" id="titlebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="13" width="20" height="8" rx="4" class="mark-bar"/>
        <rect x="5" y="9" width="4" height="4" rx="1.2" class="mark-a"/>
        <rect x="10" y="6" width="4" height="7" rx="1.2" class="mark-b"/>
        <rect x="15" y="9" width="4" height="4" rx="1.2" class="mark-c"/>
      </svg>
      <span>OpenTaskBar</span>
      <span class="badge" id="dry-badge" hidden data-i18n="dryRun"></span>
    </div>
    <div class="caption">
      <button class="caption-btn" id="btn-min" data-i18n-label="minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8"/></svg>
      </button>
      <button class="caption-btn close" id="btn-close" data-i18n-label="close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">

    <!-- 1. Welcome -->
    <section class="screen" data-screen="welcome">
      <div class="hero">
        <div class="hero-dock" aria-hidden="true">
          <div class="hero-glow"></div>
          <div class="hero-bar">
            <i style="--i:0;--c1:#4f8cff;--c2:#7b5cff"></i>
            <i style="--i:1;--c1:#ff6a88;--c2:#ff9a5a"></i>
            <i style="--i:2;--c1:#2fd59b;--c2:#1aa6c9"></i>
            <i style="--i:3;--c1:#ffc94a;--c2:#ff8f3a"></i>
            <i style="--i:4;--c1:#b26bff;--c2:#ff5fd2"></i>
            <i style="--i:5;--c1:#5ad1ff;--c2:#4f6bff"></i>
          </div>
        </div>
        <h1 class="reveal" style="--d:1" data-i18n="welcomeTitle"></h1>
        <p class="lead reveal" style="--d:2" data-i18n="welcomeLead"></p>
        <div class="hero-actions reveal" style="--d:3">
          <button class="btn primary large" data-action="next" data-i18n="welcomeStart"></button>
        </div>
        <p class="fineprint reveal" style="--d:4" data-i18n="welcomeNote"></p>
      </div>
    </section>

    <!-- 3. A few questions (after the user agreement) -->
    <section class="screen" data-screen="about">
      <div class="screen-head">
        <h2 class="reveal" style="--d:0" data-i18n="aboutTitle"></h2>
        <p class="reveal" style="--d:1" data-i18n="aboutLead"></p>
      </div>
      <div class="form">
        <div class="field reveal" style="--d:2">
          <label for="language" data-i18n="language"></label>
          <div class="select-wrap"><select id="language"></select></div>
        </div>
        <div class="field reveal" style="--d:3">
          <span class="label" data-i18n="edgeQuestion"></span>
          <div class="choices three" role="radiogroup" data-setting="Edge">
            <button class="choice" role="radio" data-value="Bottom">
              <svg viewBox="0 0 48 32" aria-hidden="true"><rect class="scr" x="1" y="1" width="46" height="30" rx="4"/><rect class="dk" x="12" y="24" width="24" height="4" rx="2"/></svg>
              <span data-i18n="edgeBottom"></span>
            </button>
            <button class="choice" role="radio" data-value="Left">
              <svg viewBox="0 0 48 32" aria-hidden="true"><rect class="scr" x="1" y="1" width="46" height="30" rx="4"/><rect class="dk" x="4" y="8" width="4" height="16" rx="2"/></svg>
              <span data-i18n="edgeLeft"></span>
            </button>
            <button class="choice" role="radio" data-value="Right">
              <svg viewBox="0 0 48 32" aria-hidden="true"><rect class="scr" x="1" y="1" width="46" height="30" rx="4"/><rect class="dk" x="40" y="8" width="4" height="16" rx="2"/></svg>
              <span data-i18n="edgeRight"></span>
            </button>
          </div>
        </div>
        <div class="toggles reveal" style="--d:4">
          <label class="toggle-row">
            <span><b data-i18n="startWithWindows"></b><small data-i18n="startWithWindowsHelp"></small></span>
            <input type="checkbox" class="switch" id="start-with-windows" checked>
          </label>
          <label class="toggle-row">
            <span><b data-i18n="checkUpdates"></b><small data-i18n="checkUpdatesHelp"></small></span>
            <input type="checkbox" class="switch" data-setting="CheckUpdates">
          </label>
        </div>
        <div class="import-card reveal" style="--d:5" id="import-card" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
          <span><b data-i18n="importTitle"></b><small data-i18n="importHelp" id="import-help"></small></span>
          <button class="btn subtle" id="btn-import" data-i18n="importButton"></button>
        </div>
      </div>
    </section>

    <!-- 2. User agreement (before the questions) -->
    <section class="screen" data-screen="license">
      <div class="screen-head">
        <h2 class="reveal" style="--d:0" data-i18n="licenseTitle"></h2>
        <p class="reveal" style="--d:1" data-i18n="licenseLead"></p>
      </div>
      <div class="license reveal" style="--d:2" id="license-text" tabindex="0"></div>
      <label class="accept reveal" style="--d:3">
        <input type="checkbox" class="check" id="accept">
        <span data-i18n="licenseAccept"></span>
      </label>
    </section>

    <!-- 4. Install -->
    <section class="screen" data-screen="install">
      <div class="install" id="install" data-state="idle">
        <div class="morph" aria-hidden="true">
          <div class="morph-screen">
            <div class="morph-bar"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
        <h2 class="reveal" style="--d:1">
          <span class="when-idle" data-i18n="installTitle"></span>
          <span class="when-working" data-i18n="installWorking"></span>
          <span class="when-done" data-i18n="installDone"></span>
          <span class="when-error" data-i18n="installFailed"></span>
        </h2>
        <p class="lead reveal" style="--d:2">
          <span class="when-idle" data-i18n="installLead"></span>
          <span class="when-working" data-i18n="installWorkingLead"></span>
          <span class="when-done" data-i18n="installDoneLead"></span>
          <span class="when-error" id="install-error"></span>
        </p>
        <div class="reveal" style="--d:3">
          <button class="btn primary large when-idle when-error" id="btn-install">
            <span class="when-idle" data-i18n="installButton"></span>
            <span class="when-error" data-i18n="retry"></span>
          </button>
          <div class="spinner when-working" aria-hidden="true"></div>
          <svg class="done-check when-done" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="23"/><path d="M15 27l7 7 15-16"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- 5a. Look -->
    <section class="screen" data-screen="look">
      <div class="split">
        <div class="pane">
          <div class="screen-head">
            <h2 class="reveal" style="--d:0" data-i18n="lookTitle"></h2>
            <p class="reveal" style="--d:1" data-i18n="liveLead"></p>
          </div>
          <div class="field reveal" style="--d:2">
            <span class="label" data-i18n="theme"></span>
            <div class="choices three compact" role="radiogroup" data-setting="Theme">
              <button class="choice" role="radio" data-value="System"><span class="swatch sys"></span><span data-i18n="themeSystem"></span></button>
              <button class="choice" role="radio" data-value="Light"><span class="swatch light"></span><span data-i18n="themeLight"></span></button>
              <button class="choice" role="radio" data-value="Dark"><span class="swatch dark"></span><span data-i18n="themeDark"></span></button>
            </div>
          </div>
          <div class="row reveal" style="--d:3">
            <div class="field">
              <span class="label" data-i18n="size"></span>
              <div class="segmented" role="radiogroup" data-setting="Size">
                <button role="radio" data-value="Compact" data-i18n="sizeCompact"></button>
                <button role="radio" data-value="Medium" data-i18n="sizeMedium"></button>
                <button role="radio" data-value="Large" data-i18n="sizeLarge"></button>
              </div>
            </div>
            <div class="field">
              <span class="label" data-i18n="material"></span>
              <div class="segmented" role="radiogroup" data-setting="DockBackground">
                <button role="radio" data-value="Glass" data-i18n="materialGlass"></button>
                <button role="radio" data-value="Solid" data-i18n="materialSolid"></button>
              </div>
            </div>
          </div>
          <div class="row reveal" style="--d:4">
            <div class="field">
              <span class="label"><span data-i18n="cornerRadius"></span><output id="radius-out"></output></span>
              <input type="range" class="range" id="radius" min="0" max="32" step="1">
            </div>
            <div class="field">
              <span class="label"><span data-i18n="opacity"></span><output id="opacity-out"></output></span>
              <input type="range" class="range" id="opacity" min="30" max="100" step="1">
            </div>
          </div>
        </div>
        <div class="preview-pane reveal" style="--d:2">
          <div class="preview" id="preview-look"></div>
        </div>
      </div>
    </section>

    <!-- 5b. Buttons -->
    <section class="screen" data-screen="buttons">
      <div class="split">
        <div class="pane">
          <div class="screen-head">
            <h2 class="reveal" style="--d:0" data-i18n="buttonsTitle"></h2>
            <p class="reveal" style="--d:1" data-i18n="buttonsLead"></p>
          </div>
          <div class="toggles">
            <label class="toggle-row icon reveal" style="--d:2">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
              <span><b data-i18n="searchButton"></b><small data-i18n="searchButtonHelp"></small></span>
              <input type="checkbox" class="switch" data-setting="ShowSearchButton">
            </label>
            <label class="toggle-row icon reveal" style="--d:3">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/></svg>
              <span><b data-i18n="taskViewButton"></b><small data-i18n="taskViewButtonHelp"></small></span>
              <input type="checkbox" class="switch" data-setting="ShowTaskViewButton">
            </label>
            <label class="toggle-row icon reveal" style="--d:4">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              <span><b data-i18n="desktopButton"></b><small data-i18n="desktopButtonHelp"></small></span>
              <input type="checkbox" class="switch" data-setting="ShowDesktopButton">
            </label>
            <label class="toggle-row icon reveal" style="--d:5">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
              <span><b data-i18n="recycleBin"></b><small data-i18n="recycleBinHelp"></small></span>
              <input type="checkbox" class="switch" data-setting="ShowRecycleBin">
            </label>
          </div>
        </div>
        <div class="preview-pane reveal" style="--d:2">
          <div class="preview" id="preview-buttons"></div>
        </div>
      </div>
    </section>

    <!-- 5c. Widgets -->
    <section class="screen" data-screen="widgets">
      <div class="screen-head">
        <h2 class="reveal" style="--d:0" data-i18n="widgetsTitle"></h2>
        <p class="reveal" style="--d:1"><span data-i18n="widgetsLead"></span> <span class="count" id="widget-count"></span></p>
      </div>
      <div class="widget-grid" id="widget-grid"></div>
    </section>

    <!-- 6. Done -->
    <section class="screen" data-screen="done">
      <div class="finale">
        <div class="burst" aria-hidden="true" id="burst"></div>
        <svg class="finale-check" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring" cx="60" cy="60" r="52"/>
          <path class="tick" d="M38 62l15 15 30-33"/>
        </svg>
        <h1 class="reveal" style="--d:2" data-i18n="doneTitle"></h1>
        <p class="lead reveal" style="--d:3" data-i18n="doneLead"></p>
        <ul class="tips reveal" style="--d:4">
          <li data-i18n="tipRightClick"></li>
          <li data-i18n="tipSettings"></li>
        </ul>
        <button class="btn primary large reveal" style="--d:5" data-action="finish" data-i18n="doneButton"></button>
      </div>
    </section>
  </main>

  <footer class="nav" id="nav">
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
    <div class="nav-row">
      <div class="steps" id="steps"></div>
      <div class="nav-actions">
        <button class="btn ghost" id="btn-skip" data-i18n="skipCustomize" hidden></button>
        <button class="btn subtle" id="btn-back" data-i18n="back"></button>
        <button class="btn primary" id="btn-next" data-i18n="next"></button>
      </div>
    </div>
  </footer>
</div>
<script>/*@STRINGS*/</script>
<script>/*@SCRIPT*/</script>
</body>
</html>
